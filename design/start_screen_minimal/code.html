<div class="flex flex-col items-center justify-center text-center my-auto px-space-xs">

<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container text-on-tertiary-fixed-variant mb-space-md shadow-sm">

<h1 class="font-display-mobile text-display-mobile text-on-surface tracking-tight text-balance">

<p class="font-body-md text-body-md text-outline mt-space-sm font-medium">

<div class="flex items-center justify-center gap-1.5 mt-space-lg opacity-40">

<script>
  (function() {
    const btn = document.getElementById('start-diagnostic-btn');
    if (!btn) return;
    btn.addEventListener('click', function() {
      btn.classList.add('opacity-90', 'scale-95');
      setTimeout(() => {
        btn.classList.remove('scale-95');
      }, 150);
    });
  })();
