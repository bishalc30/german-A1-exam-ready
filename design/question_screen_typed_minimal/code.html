  </head><body class="bg-surface-container-lowest text-on-surface antialiased flex flex-col items-center min-h-screen"><div class="w-full max-w-[480px] min-h-screen flex flex-col relative bg-surface-container-lowest"><header class="fixed top-0 w-full max-w-[480px] z-50 bg-surface-container-lowest/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.02)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><span class="font-headline-lg-mobile text-headline-lg-mobile text-primary-container tracking-tight">Globio</span><span class="hidden">Question Screen Typed Answer</span></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div><a aria-label="Diagnose beenden" class="w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-on-surface rounded-full transition-colors" data-path="start-screen" href="#"><span class="material-symbols-outlined text-[20px]">close</span></a></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface-container-lowest"><div class="flex flex-col w-full">
<!-- Thin Horizontal Progress Bar -->
<div class="w-full bg-surface-container-high h-1 rounded-full overflow-hidden mb-space-lg">
<div class="bg-primary-container h-full w-2/5 rounded-full transition-all duration-300"></div>
</div>
<!-- Screen Content Flow -->
<div class="flex flex-col w-full justify-between pt-space-xs pb-space-lg min-h-[calc(100vh-8.5rem)]">
<div class="flex flex-col w-full">
<!-- Category & Step Indicator -->
<div class="flex items-center mb-space-md">
<span class="font-label-sm text-label-sm uppercase tracking-wider text-outline">
          Grammar · 2 of 5
        </span>
</div>
<!-- Prompt Question & Translation Hint -->
<div class="flex flex-col space-y-space-xs mb-space-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
          Ich wohne in einer <span class="text-primary-container underline decoration-primary-container/30 underline-offset-8">_______</span>.
        </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
          (flat)
        </p>
</div>
<!-- Focused Input Container -->
<div class="w-full">
<label class="sr-only" for="answer-input">Type answer</label>
<div class="relative w-full rounded-DEFAULT bg-surface-container-low transition-colors duration-200 focus-within:bg-surface-container">
<input autocomplete="off" class="w-full bg-transparent px-space-md py-space-md text-on-surface font-body-lg text-body-lg placeholder:text-outline focus:outline-none rounded-DEFAULT" id="answer-input" placeholder="Type answer..." spellcheck="false" type="text"/>
</div>
</div>
</div>
<!-- Bottom Thumb-Zone CTA -->
<div class="w-full pt-space-lg">
<button class="w-full bg-primary-container hover:bg-tertiary text-on-primary font-label-lg text-label-lg py-space-md px-space-lg rounded-lg shadow-sm transition-all duration-150 flex items-center justify-center active:scale-[0.99]" id="submit-btn" type="button">
        Next
      </button>
</div>
</div>
</div>
<script>
  (function () {
    const input = document.getElementById('answer-input');
    const button = document.getElementById('submit-btn');

    if (input) {
      input.focus();
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          button.click();
        }
      });
    }

    if (button) {
      button.addEventListener('click', function () {
        button.classList.add('opacity-90');
        setTimeout(() => {
          button.classList.remove('opacity-90');
        }, 150);
      });
    }
  })();
</script></main></div></body></html>
