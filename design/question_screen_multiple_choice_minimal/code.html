 'secondary': '#006e2d', 'on-secondary': '#ffffff' }, borderRadius: { 'DEFAULT': '1rem', 'lg': '2rem', 'xl': '3rem', 'full': '9999px' }, spacing: { 'space-xl': '3.5rem', 'space-md': '1.25rem', 'margin': '1.5rem', 'space-xs': '0.5rem', 'gutter-desktop': '2rem', 'space-lg': '2rem', 'space-sm': '0.75rem', 'margin-desktop': '3rem', 'gutter': '1rem' }, fontFamily: { 'headline-md': ['Plus Jakarta Sans'], 'label-sm': ['Plus Jakarta Sans'], 'body-md': ['Plus Jakarta Sans'], 'label-md': ['Plus Jakarta Sans'], 'body-lg': ['Plus Jakarta Sans'], 'label-lg': ['Plus Jakarta Sans'], 'headline-lg': ['Plus Jakarta Sans'], 'display': ['Plus Jakarta Sans'], 'headline-lg-mobile': ['Plus Jakarta Sans'], 'display-mobile': ['Plus Jakarta Sans'] }, fontSize: { 'headline-md': ['1.375rem', { lineHeight: '1.875rem', letterSpacing: '-0.01em', fontWeight: '600' }], 'label-sm': ['0.75rem', { lineHeight: '1rem', letterSpacing: '0.05em', fontWeight: '600' }], 'body-md': ['1rem', { lineHeight: '1.625rem', letterSpacing: '0em', fontWeight: '400' }], 'label-md': ['0.875rem', { lineHeight: '1.25rem', letterSpacing: '0.02em', fontWeight: '500' }], 'body-lg': ['1.125rem', { lineHeight: '1.75rem', letterSpacing: '0em', fontWeight: '400' }], 'label-lg': ['1rem', { lineHeight: '1.5rem', letterSpacing: '0.01em', fontWeight: '600' }], 'headline-lg': ['2rem', { lineHeight: '2.5rem', letterSpacing: '-0.02em', fontWeight: '700' }], 'display': ['3rem', { lineHeight: '3.5rem', letterSpacing: '-0.03em', fontWeight: '800' }], 'headline-lg-mobile': ['1.625rem', { lineHeight: '2.125rem', letterSpacing: '-0.015em', fontWeight: '700' }], 'display-mobile': ['2.25rem', { lineHeight: '2.75rem', letterSpacing: '-0.025em', fontWeight: '800' }] } } } };</script><style>

  </head><body class="bg-surface-container-lowest text-on-surface antialiased flex flex-col items-center min-h-screen"><div class="w-full max-w-[480px] min-h-screen flex flex-col relative bg-surface-container-lowest"><header class="fixed top-0 w-full max-w-[480px] z-50 bg-surface-container-lowest/80 backdrop-blur-xl pt-safe shadow-[0_1px_8px_rgba(0,0,0,0.02)]"><div class="h-16 px-margin flex items-center justify-between"><div class="flex items-center gap-space-sm"><span class="font-headline-lg-mobile text-headline-lg-mobile text-primary-container tracking-tight">Globio</span><span class="hidden">Question Screen Multiple Choice</span></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div><a aria-label="Diagnose beenden" class="w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-on-surface rounded-full transition-colors" data-path="start-screen" href="#"><span class="material-symbols-outlined text-[20px]">close</span></a></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-safe bg-surface-container-lowest"><div class="flex flex-col w-full pb-safe">
<!-- Top Progress Indicator -->
<div class="w-full flex flex-col gap-space-xs mb-space-lg">
<div class="w-full h-1 bg-surface-container rounded-full overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-3/5 transition-all duration-300"></div>
</div>
<div class="flex items-center justify-between">
<span class="font-label-sm text-label-sm text-outline">Reading · 3 of 5</span>
<span class="font-label-sm text-label-sm text-primary-container font-semibold">B1 Diagnostic</span>
</div>
</div>
<!-- Question Prompt Card -->
<div class="w-full bg-surface-container-low rounded-lg p-space-lg mb-space-lg shadow-sm">
<span class="font-label-sm text-label-sm text-outline uppercase tracking-wider block mb-space-xs">Leseverstehen</span>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">
      Wann beginnt der Deutschkurs?
    </h2>
</div>
<!-- Answer Options -->
<form class="flex flex-col gap-space-sm mb-space-xl" id="diagnostic-options">
<button class="option-btn w-full min-h-[64px] px-space-md py-space-sm rounded bg-surface-container-low text-on-surface hover:bg-surface-container flex items-center justify-between text-left transition-all duration-150" data-option="1" type="button">
<span class="font-body-lg text-body-lg text-on-surface">Um 9:00 Uhr</span>
<span class="check-icon material-symbols-outlined text-primary-container opacity-0 transition-opacity">check_circle</span>
</button>
<button class="option-btn w-full min-h-[64px] px-space-md py-space-sm rounded bg-surface-container text-on-surface flex items-center justify-between text-left transition-all duration-150 shadow-sm" data-option="2" type="button">
<span class="font-body-lg text-body-lg text-on-surface font-semibold">Am Samstag</span>
<span class="check-icon material-symbols-outlined text-primary-container opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="option-btn w-full min-h-[64px] px-space-md py-space-sm rounded bg-surface-container-low text-on-surface hover:bg-surface-container flex items-center justify-between text-left transition-all duration-150" data-option="3" type="button">
<span class="font-body-lg text-body-lg text-on-surface">In Raum 4</span>
<span class="check-icon material-symbols-outlined text-primary-container opacity-0 transition-opacity">check_circle</span>
</button>
<!-- Softer neutral choice -->
<div class="pt-space-xs">
<button class="option-btn w-full min-h-[56px] px-space-md py-space-sm rounded bg-surface-bright text-on-surface-variant hover:bg-surface-container-low flex items-center justify-center transition-all duration-150" data-option="skip" type="button">
<span class="font-label-md text-label-md text-outline">I'm not sure</span>
</button>
</div>
</form>
<!-- Sticky Thumb Zone Next Action -->
<div class="mt-auto w-full pt-space-md">
<a class="w-full flex items-center justify-center min-h-[58px] rounded-lg bg-primary-container hover:bg-primary text-on-primary font-label-lg text-label-lg transition-colors shadow-sm active:scale-[0.99]" data-path="next-step" href="#">
      Next
    </a>
</div>
</div>
<script>
  (function() {
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        buttons.forEach(b => {
          const isSkip = b.getAttribute('data-option') === 'skip';
          const icon = b.querySelector('.check-icon');
          if (isSkip) {
            b.className = 'option-btn w-full min-h-[56px] px-space-md py-space-sm rounded bg-surface-bright text-on-surface-variant hover:bg-surface-container-low flex items-center justify-center transition-all duration-150';
          } else {
            b.className = 'option-btn w-full min-h-[64px] px-space-md py-space-sm rounded bg-surface-container-low text-on-surface hover:bg-surface-container flex items-center justify-between text-left transition-all duration-150';
            if (icon) {
              icon.classList.remove('opacity-100');
              icon.classList.add('opacity-0');
              icon.style.fontVariationSettings = "'FILL' 0";
            }
          }
        });

        const isCurrentSkip = btn.getAttribute('data-option') === 'skip';
        const currentIcon = btn.querySelector('.check-icon');
        if (isCurrentSkip) {
          btn.className = 'option-btn w-full min-h-[56px] px-space-md py-space-sm rounded bg-surface-container text-primary font-semibold flex items-center justify-center transition-all duration-150 shadow-sm';
        } else {
          btn.className = 'option-btn w-full min-h-[64px] px-space-md py-space-sm rounded bg-surface-container text-on-surface flex items-center justify-between text-left transition-all duration-150 shadow-sm';
          if (currentIcon) {
            currentIcon.classList.remove('opacity-0');
            currentIcon.classList.add('opacity-100');
            currentIcon.style.fontVariationSettings = "'FILL' 1";
          }
        }
      });
    });
  })();
</script></main></div></body></html>
